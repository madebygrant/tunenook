<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06080c" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png?v=2" />
    <!-- document.title changes per page; this fixes the home-screen label at install -->
    <meta name="apple-mobile-web-app-title" content="TuneNook" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>TuneNook</title>
    <style>
      /* Paints before the bundle so a cold open is never a blank screen. */
      html,
      body {
        background: #0a0c12;
      }
      body {
        margin: 0;
      }
      .boot {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        color: #8a847a;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"><p class="boot">Opening your library…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
